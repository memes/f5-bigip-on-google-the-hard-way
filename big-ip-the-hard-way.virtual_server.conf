# Simple virtual server to verify failover behavior for BIG-IP on Google Cloud the hard way.
#
# NOTE: The destination in line 19 must be updated to the correct public IP address VIP.
#
# Source: https://github.com/memes/f5-bigip-on-google-the-hard-way/blob/main/big-ip-the-hard-way.ssh_config

ltm rule big-ip-the-hard-way {
    when RULE_INIT {
        set static::hostname [info hostname]
    }

    when HTTP_REQUEST {
        set resp "{\"message\":\"BIG-IP the hard way\",\"host\":\"[HTTP::host]\",\"vip\":\"[IP::local_addr]\",\"hostname\":\"$static::hostname\"}"
        HTTP::respond 200 content $resp "Content-Type" "application/json"
    }
}

ltm virtual big-ip-the-hard-way {
    destination _REPLACE_WITH_VIP_ADDRESS_:80
    ip-protocol tcp
    profiles {
        http { }
        tcp { }
    }
    rules { big-ip-the-hard-way }
    source-address-translation { type automap }
    vlans { external }
    vlans-enabled
}
